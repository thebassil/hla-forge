[project]
name = "hlaforge"
version = "0.1.0"
description = "Controlled ablation harness for peptide-HLA stability prediction with protein foundation models"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "xgboost>=2.1",
]

[project.optional-dependencies]
plm = [
    "torch>=2.2",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hla = "hlaforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hlaforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
